[project]
name = "dl"
version = "0.1.0"
description = "Workspace for building the deep learning model."
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.5",
    "nltk>=3.9.4",
    "scikit-learn>=1.9.0",
    "torch>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dl"]

[dependency-groups]
dev = [
    "marimo>=0.23.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
