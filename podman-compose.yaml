services:
  db:
    image: docker.io/library/postgres:18-alpine
    container_name: trade-sentiment-journal-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}",
        ]
      interval: 10s
      timeout: 5s
      retires: 5
      start_period: 30s

volumes:
  pg_data:
