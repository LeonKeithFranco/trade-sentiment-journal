name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v7.0.1

      - name: install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: install dependencies
        run: uv sync --all-packages --locked

      - name: lint check
        run: uv run ruff check

      - name: format check
        run: uv run ruff format --check

      - name: type check
        run: uv run ty check
